<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results - Devaksa Green Solutions</title> <!-- Changed title to Results/Cart -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        .page-header {
            text-align: center;
            padding: 120px 20px 40px;
            background: linear-gradient(135deg, #fdfbf7 0%, #fff 100%);
        }

        .page-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            color: #2D3E2F;
            margin-bottom: 10px;
        }

        .cart-container {
            max-width: 800px;
            margin: 0 auto 60px;
            padding: 0 20px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            transition: transform 0.3s ease;
        }

        .cart-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(53, 50, 50, 0.06);
        }

        .cart-img {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            object-fit: contain;
            background: #f9f9f9;
            margin-right: 20px;
        }

        .cart-details {
            flex-grow: 1;
        }

        .cart-details h3 {
            font-size: 18px;
            font-weight: 600;
            color: #2D3E2F;
            margin-bottom: 5px;
        }

        .cart-details p {
            font-size: 14px;
            color: #666;
        }

        .cart-price {
            font-weight: 700;
            color: var(--sage-green);
            margin-top: 5px;
            display: block;
        }

        .cart-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-end;
        }

        .btn-sm-main {
            background: var(--sage-green);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-sm-remove {
            background: #ffebeb;
            color: #d32f2f;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-sm-remove:hover {
            background: #ffdcdc;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <img src="devaaks-logo.png" alt="Devaksa Logo" class="logo-img">
            </a>

            

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#products">Products</a></li>
                <li><a href="index.html#reviews">Reviews</a></li>
                <li><a href="index.html#contact">Contact</a></li>
                <li class="auth-buttons">
                    <a href="login.html" class="btn-login" id="login-btn">Login</a>
                </li>
            </ul>

            <div class="nav-icons">
                <a href="cart.html" class="cart-icon">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span class="cart-dot" style="display: none;"></span>
                </a>
                <a href="javascript:void(0)" onclick="logout()" id="logout-btn" style="display: none;">
                    <i class="fa-solid fa-arrow-right-from-bracket" title="Logout"></i>
                </a>
            </div>
            <div class="mobile-menu-btn" onclick="toggleMobileMenu()">
                <i class="fa-solid fa-bars"></i>
            </div>
        </div>
    </nav>

    <div class="page-header">
        <h1>Your Shopping Cart</h1>
        <p>Review your selected items</p>
    </div>

    <div class="cart-container" id="cart-items-container">
        <div class="empty-state">
            <i class="fa-solid fa-spinner fa-spin" style="font-size: 30px; margin-bottom: 20px;"></i>
            <p>Loading your cart...</p>
        </div>
    </div>

    <!-- Custom Confirmation Modal (Reused) -->
    <div class="modal-overlay" id="confirm-modal">
        <div class="modal-content" style="max-width: 400px; padding: 30px;">
            <div class="confirm-icon" style="font-size: 40px; color: var(--sage-green); margin-bottom: 20px;">
                <i class="fa-solid fa-circle-info"></i>
            </div>
            <h3 id="confirm-message" style="margin-bottom: 25px; color: #333; font-size: 18px; line-height: 1.5;">Are
                you sure?</h3>
            <div class="button-row" style="justify-content: center; gap: 15px;">
                <button class="btn-secondary" onclick="closeConfirmModal()" style="min-width: 100px;">Cancel</button>
                <button class="btn-main" id="confirm-yes-btn" style="min-width: 100px;">Yes</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Inline script to load cart items
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = "login.html";
                return;
            }

            checkAuthState(); // Ensure navbar is correct

            const container = document.getElementById('cart-items-container');

            try {
                console.log("Fetching cart for token:", token);
                const response = await fetch('/api/cart', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                console.log("Fetch response status:", response.status);

                if (response.ok) {
                    const cartItems = await response.json();
                    console.log("Cart items fetched:", cartItems);

                    if (cartItems.length === 0) {
                        console.log("Cart is empty.");
                        container.innerHTML = `
                            <div class="empty-state">
                                <i class="fa-solid fa-basket-shopping" style="font-size: 40px; margin-bottom: 20px; color: #ccc;"></i>
                                <p>Your cart is empty.</p>
                                <a href="index.html#products" class="btn-sm-main" style="margin-top: 20px; display: inline-block; text-decoration: none;">Browse Products</a>
                            </div>
                        `;
                    } else {
                        console.log("Rendering items...");
                        container.innerHTML = cartItems.map(item => `
                            <div class="cart-item">
                                <img src="${item.image || 'devaaks-logo.png'}" alt="${item.productName}" class="cart-img" onerror="this.src='devaaks-logo.png'">
                                <div class="cart-details">
                                    <h3>${item.productName}</h3>
                                    <p>Quantity: ${item.quantity}</p>
                                    <span class="cart-price">₹${item.price || '499'}</span>
                                </div>
                                <div class="cart-actions">
                                    <button class="btn-sm-main" onclick="openEnquiry('${item.productName}')">Buy Now</button>
                                    <button class="btn-sm-remove" onclick="removeFromCart('${item.productName}')">Remove</button>
                                </div>
                            </div>
                        `).join('');
                    }
                } else {
                    const errText = await response.text();
                    console.error("Fetch failed:", errText);
                    container.innerHTML = `<p class="empty-state">Failed to load cart. Status: ${response.status}</p>`;
                }
            } catch (error) {
                console.error("Error loading cart:", error);
                container.innerHTML = '<p class="empty-state">Something went wrong.</p>';
            }
        });

        async function removeFromCart(productName) {
            const token = localStorage.getItem('token');
            // Optimistic UI update or simple reload
            try {
                const response = await fetch(`/api/cart/${encodeURIComponent(productName)}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    window.location.reload(); // Simple reload to refresh list
                } else {
                    alert("Failed to remove item.");
                }
            } catch (e) {
                console.error(e);
            }
        }
    </script>
</body>

</html>
