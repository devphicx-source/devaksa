<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Send Enquiry Popup</title>

<style>
body{
    font-family: Arial;
    padding:50px;
}

/* Send Enquiry Button */
.enquiry-btn{
    padding:12px 25px;
    background:#ff7a00;
    color:white;
    border:none;
    font-size:16px;
    cursor:pointer;
    border-radius:5px;
}

/* Popup Background */
.popup{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
}

/* Popup Box */
.popup-content{
    background:white;
    width:380px;
    padding:20px;
    border-radius:8px;
    margin:6% auto;
    position:relative;
    animation:fadeIn 0.3s;
}

/* Animation */
@keyframes fadeIn{
    from{transform:scale(0.8);opacity:0;}
    to{transform:scale(1);opacity:1;}
}

/* Close Button */
.close{
    position:absolute;
    right:15px;
    top:10px;
    font-size:22px;
    cursor:pointer;
}

/* Heading */
h2{
    margin-top:10px;
    font-size:20px;
}

/* Inputs */
input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:14px;
}

/* Continue Button */
.continue-btn{
    width:100%;
    padding:12px;
    background:#ff7a00;
    color:white;
    border:none;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
}

.continue-btn:hover{
    background:#e56b00;
}
</style>

</head>

<body>



<!-- Popup -->
<div id="popup" class="popup">
    <div class="popup-content">

        <span class="close" onclick="closePopup()">×</span>

        <h2>Get a Quick Quote from this Supplier</h2>

        <label>Product / Service Name</label>
        <input type="text" placeholder="Enter your Product Name">

        <label>Quantity</label>
        <input type="text" placeholder="Metric Ton">

        <label>Mobile Number</label>
        <input type="text" placeholder="+91 Enter Mobile Number">

        <button class="continue-btn">Continue</button>

    </div>
</div>

<script>
function openPopup(){
    document.getElementById("popup").style.display="block";
}

function closePopup(){
    document.getElementById("popup").style.display="none";
}
</script>



</body>
</html>
