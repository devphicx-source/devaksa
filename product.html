<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Devaksa Green Solutions</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        .product-detail-container {
            max-width: var(--container-width);
            margin: 120px auto 60px;
            padding: 0 20px;
        }

        .product-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: start;
        }

        .product-image-section {
            background: #fdfdfd;
            border-radius: 30px;
            padding: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: var(--shadow-card);
        }

        .product-image-section img {
            max-width: 100%;
            height: auto;
            border-radius: 20px;
            transition: transform 0.5s ease;
        }

        .product-info-section {
            padding: 20px 0;
        }

        .detail-badge {
            display: inline-block;
            background: var(--soft-cream);
            color: var(--sage-green);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .detail-title {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .detail-description {
            font-size: 18px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .detail-price {
            font-size: 28px;
            font-weight: 700;
            color: var(--sage-green);
            margin-bottom: 30px;
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .detail-price span {
            font-size: 16px;
            color: #888;
            font-weight: 400;
        }

        .detail-list {
            margin: 30px 0;
        }

        .detail-list h4 {
            font-size: 18px;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .detail-list li {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #555;
        }

        .detail-list li i {
            color: var(--sage-green);
            font-size: 14px;
        }

        .detail-meta {
            background: #f9f9f9;
            padding: 25px;
            border-radius: 20px;
            margin-top: 30px;
        }

        .meta-item {
            margin-bottom: 15px;
        }

        .meta-item:last-child {
            margin-bottom: 0;
        }

        .meta-item strong {
            display: block;
            font-size: 14px;
            color: #888;
            margin-bottom: 4px;
        }

        .meta-item span {
            font-size: 16px;
            color: var(--text-main);
            font-weight: 600;
        }

        .action-buttons {
            display: flex;
            gap: 20px;
            margin-top: 40px;
        }

        .action-buttons .btn-main {
            padding: 16px 40px;
            font-size: 17px;
        }

        /* Contact Footer Override/Addition as requested */
        .product-contact-footer {
            background: var(--sage-green);
            color: white;
            padding: 60px 20px;
            text-align: center;
            margin-top: 80px;
        }

        .contact-card-box {
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 40px;
            border-radius: 20px;
        }

        .contact-card-box h2 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .contact-card-box p {
            font-size: 18px;
            margin-bottom: 25px;
            opacity: 0.9;
        }

        .contact-numbers {
            font-size: 20px;
            font-weight: 600;
        }

        .contact-numbers i {
            margin-right: 10px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-weight: 500;
            text-decoration: none;
            margin-bottom: 30px;
            transition: var(--transition-ease);
            font-size: 15px;
        }

        .back-btn:hover {
            color: var(--sage-green);
            transform: translateX(-5px);
        }
        .btn-main-p{
width: 50%;
        }

        @media (max-width: 768px) {
            .product-detail-grid {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .detail-title {
                font-size: 32px;
            }

            .product-detail-container {
                margin-top: 100px;
            }

            .action-buttons {
                flex-direction: column;
                gap: 12px;
            }

            .action-buttons .btn-main,
            .action-buttons .btn-secondary {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <img src="devaks-logo.png" alt="Devaksa Logo" class="logo-img">
            </a>
            <div class="nav-links">
                <a href="index.html#products">Products</a>
                <a href="index.html#about">Our Story</a>
                <a href="index.html#reviews">Reviews</a>
                <a href="index.html#contact">Contact</a>
            </div>
            <div class="nav-icons">
                <a href="cart.html" class="nav-icon-link" style="position: relative;"><i
                        class="fa-solid fa-bag-shopping"></i><span class="cart-dot"></span></a>
                <a href="login.html" id="login-btn" class="nav-icon-link"><i class="fa-regular fa-user"></i></a>
                <a href="#" id="logout-btn" class="nav-icon-link" style="display: none;" onclick="logout()"><i
                        class="fa-solid fa-right-from-bracket"></i></a>
                <div class="mobile-menu-btn" onclick="toggleMobileMenu()">
                    <i class="fa-solid fa-bars"></i>
                </div>
            </div>
        </div>
    </nav>

    <main class="product-detail-container">
        <a href="index.html#products" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> Back to Collection
        </a>
        <div class="product-detail-grid">
            <!-- Left Side: Image -->
            <div class="product-image-section">
                <img id="product-img" src="" alt="Product Image">
            </div>

            <!-- Right Side: Content -->
            <div class="product-info-section">
                <span class="detail-badge" id="product-badge"></span>
                <h1 class="detail-title" id="product-name"></h1>
                <p class="detail-description" id="product-desc"></p>

                <div class="detail-price">
                    <span id="product-price"></span>
                    <span>Inclusive of all taxes</span>
                </div>

                <div class="detail-list">
                    <h4>Key Benefits:</h4>
                    <ul id="product-benefits"></ul>
                </div>

                <div class="detail-meta">
                    <div class="meta-item">
                        <strong>Available Packaging:</strong>
                        <span id="product-packaging"></span>
                    </div>
                    <div class="meta-item">
                        <strong>Usage:</strong>
                        <span id="product-usage"></span>
                    </div>
                    <div class="meta-item">
                        <strong>Shelf Life:</strong>
                        <span id="product-shelflife"></span>
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="btn-main btn-main-p" onclick="buyNowFromDetail()">Buy Now</button>
                    <button class="btn-secondary" onclick="addToCartFromDetail()"><i
                            class="fa-solid fa-cart-shopping"></i> Add to Cart</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Specific Contact Footer as requested -->
    <section class="product-contact-footer">
        <div class="contact-card-box">
            <h2 id="footer-company-name">Devaksa Green Solutions Ltd</h2>
            <p id="footer-tagline">Pure & Sustainable Products for Healthy Living and Farming</p>
            <div class="contact-numbers">
                <i class="fa-solid fa-phone"></i>
                <span>+91 9302725474 | +91 8319093312</span>
            </div>
        </div>
    </section>

    <!-- Modal placeholders (copied from main) -->
    <div id="enquiry-modal" class="modal-overlay">
        <!-- ... same as index.html ... -->
    </div>

    <!-- Scripts -->
    <script src="script.js"></script>
    <script src="products_data.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            if (productId && window.productsData[productId]) {
                const p = window.productsData[productId];
                document.title = `${p.name} | Devaksa Green Solutions`;
                document.getElementById('product-name').textContent = p.name;
                document.getElementById('product-img').src = p.image;
                document.getElementById('product-img').alt = p.name;
                document.getElementById('product-badge').textContent = p.badge;
                document.getElementById('product-desc').textContent = p.description;
                document.getElementById('product-price').prepend(`₹${p.price} `);
                document.getElementById('product-packaging').textContent = p.packaging;
                document.getElementById('product-usage').textContent = p.usage;
                document.getElementById('product-shelflife').textContent = p.shelfLife;

                const benefitsList = document.getElementById('product-benefits');
                p.benefits.forEach(benefit => {
                    const li = document.createElement('li');
                    li.innerHTML = `<i class="fa-solid fa-check-circle"></i> ${benefit}`;
                    benefitsList.appendChild(li);
                });
            } else {
                // If product not found, redirect to home
                window.location.href = 'index.html';
            }
        });

        function buyNowFromDetail() {
            const name = document.getElementById('product-name').textContent;
            if (typeof openEnquiry === 'function') {
                openEnquiry(name);
            }
        }

        function addToCartFromDetail() {
            const name = document.getElementById('product-name').textContent;
            if (typeof addToCart === 'function') {
                addToCart(name);
            }
        }
    </script>
</body>

</html>
