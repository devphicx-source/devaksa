<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Devaksa</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: var(--font-stack);
            background-image: radial-gradient(#e0e0e0 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .auth-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
            position: relative;
            overflow: hidden;
        }

        .auth-branding {
            margin-bottom: 30px;
        }

        .auth-branding h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: var(--sage-green);
            margin: 0;
        }

        .toggle-box {
            display: flex;
            background: #f0f0f0;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 30px;
            position: relative;
        }

        .toggle-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
            z-index: 2;
        }

        .toggle-btn.active {
            color: #fff;
            background: var(--sage-green);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
            text-align: left;
        }

        .input-group label {
            font-size: 12px;
            color: #666;
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
            margin-left: 4px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            background: #fbfbfd;
            font-size: 15px;
            transition: all 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--sage-green);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(79, 111, 82, 0.1);
        }

        .auth-btn {
            width: 100%;
            background: var(--sage-green);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            margin-top: 10px;
        }

        .auth-btn:hover {
            background: #3e5940;
            transform: translateY(-2px);
        }

        .forgot-pass {
            display: block;
            margin-top: 15px;
            font-size: 13px;
            color: #888;
            text-decoration: none;
        }

        .forgot-pass:hover {
            color: var(--sage-green);
            text-decoration: underline;
        }

        .back-home {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #999;
            font-size: 18px;
            transition: color 0.2s;
        }

        .back-home:hover {
            color: var(--sage-green);
        }

        /* Form Animation */
        .form-wrapper {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i></a>

    <div class="auth-container">
        <div class="auth-branding">
            <h1>Devaksa.</h1>
            <p style="color: #888; font-size: 14px; margin-top: 5px;">Pure & Organic Essentials</p>
        </div>

        <div class="toggle-box">
            <button class="toggle-btn active" onclick="showLogin()">Login</button>
            <button class="toggle-btn" onclick="showSignup()">Sign Up</button>
        </div>

        <!-- Login Form -->
        <div id="login-form" class="form-wrapper">
            <form onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="hello@example.com" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="auth-btn">Log In</button>
                <a href="#" class="forgot-pass">Forgot Password?</a>
            </form>
        </div>

        <!-- Sign Up Form -->
        <div id="signup-form" class="form-wrapper hidden">
            <form onsubmit="handleSignup(event)">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="John Doe" required>
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="hello@example.com" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Create a password" required>
                </div>
                <button type="submit" class="auth-btn">Create Account</button>
            </form>
        </div>

    </div>

    <script>
        function showLogin() {
            document.getElementById('login-form').classList.remove('hidden');
            document.getElementById('signup-form').classList.add('hidden');
            document.querySelectorAll('.toggle-btn')[0].classList.add('active');
            document.querySelectorAll('.toggle-btn')[1].classList.remove('active');
        }

        function showSignup() {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('signup-form').classList.remove('hidden');
            document.querySelectorAll('.toggle-btn')[0].classList.remove('active');
            document.querySelectorAll('.toggle-btn')[1].classList.add('active');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = e.target.querySelector('input[type="email"]').value;
            const password = e.target.querySelector('input[type="password"]').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (response.ok) {
                    showSuccessModal("Logged in successfully, redirecting...");
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = "index.html";
                } else {
                    showSuccessModal("Login failed");
                }
            } catch (error) {
                console.error("Error:", error);
                showSuccessModal("Server error");
            }
        }

        async function handleSignup(e) {
            e.preventDefault();
            const inputs = e.target.querySelectorAll('input');
            const name = inputs[0].value;
            const email = inputs[1].value;
            const password = inputs[2].value;

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await response.json();

                if (response.ok) {

                    showSuccessModal("Account Created! Please Log In.");

                    showLogin();
                } else {
                        showSuccessModal(data.message || "Signup failed");
                }
            } catch (error) {
                console.error("Error:", error);
                showSuccessModal("Server error");
            }
        }

        // Custom Toast Notification Logic
        function showSuccessModal(message) {
            // Create toast element dynamically
            let toast = document.querySelector('.toast-notification');
            if (!toast) {
                toast = document.createElement('div');
                toast.className = 'toast-notification';
                toast.innerHTML = '<i class="fa-solid fa-circle-check"></i> <span></span>';
                document.body.appendChild(toast);
            }

            toast.querySelector('span').textContent = message;

            // Show toast
            requestAnimationFrame(() => {
                toast.classList.add('active');
            });

            // Hide after 3 seconds
            setTimeout(() => {
                toast.classList.remove('active');
            }, 3000);
        }
    </script>

</body>

</html>
