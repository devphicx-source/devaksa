<!DOCTYPE html>
<html>
<head>
<title>Review Page</title>

<style>
body{
  font-family: Arial;
  text-align:center;
  padding:40px;
}

.popup-content{
  width:400px;
  margin:auto;
  padding:20px;
  box-shadow:0 0 10px rgba(0,0,0,0.2);
  border-radius:10px;
}

.stars{
  font-size:24px;
  color:orange;
}

textarea{
  width:100%;
  height:100px;
  
}

.submit-btn{
  background:#c8742a;
  color:white;
  padding:10px 20px;
  border:none;
  border-radius:5px;
}
.big-select{
    width: 250px;
    height: 35px;
    font-size: 16px;
    padding: 5px 10px;
}
</style>

</head>

<body>

<h2>Rate Your Experience with 
<span style="color:#c8742a;">Devaksa Green Solutions</span></h2>

<label>Select the product/service for which you are writing review for this business</label><br><br>

<select class="big-select">
    <option value=""disabled selected hidden>Select product</option>
  <option>Moringa Powder</option>
  <option>Raw Forest Honey</option>
  <option>Manure</option>
  <option>Cow Dung Cake</option>
</select>

<p>Your Rating</p>

<div class="stars">★★★★★</div>

<textarea placeholder="Write your review here (Minimum 20 characters)"></textarea>

<br><br>

<button class="submit-btn">Submit</button>

</body>
</html>
